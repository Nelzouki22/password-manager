{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-3">{{ 'Edit entry' if editing else 'Add a password' }}</h1>
    <div class="card shadow-sm mb-3">
      <div class="card-body p-4">
        <form method="post" action="{{ url_for('credential_edit', credential_id=credential_id) if editing else url_for('credential_new') }}" autocomplete="off">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="account_name">Account name</label>
              <input class="form-control" id="account_name" name="account_name" value="{{ form.account_name }}" maxlength="100" required placeholder="e.g. Personal email">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="username">Username or email</label>
              <input class="form-control" id="username" name="username" value="{{ form.username }}" maxlength="200" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="website_url">Website URL <span class="text-body-secondary">(optional)</span></label>
              <input class="form-control" id="website_url" name="website_url" value="{{ form.website_url }}" maxlength="2048" placeholder="https://example.com">
            </div>
            <div class="col-12">
              <label class="form-label" for="password">Password{% if editing %} <span class="text-body-secondary">(leave blank to keep the current one)</span>{% endif %}</label>
              <div class="input-group">
                <input class="form-control font-monospace" id="password" name="password" type="password" maxlength="1024" {{ '' if editing else 'required' }} autocomplete="new-password">
                <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
              </div>
              <div class="d-flex align-items-center gap-2 mt-2">
                <progress id="strength-meter" class="meter flex-grow-1" value="0" max="5"></progress>
                <span id="strength-label" class="small text-body-secondary">&nbsp;</span>
              </div>
              <ul id="strength-feedback" class="small text-body-secondary mb-0 mt-1 ps-3"></ul>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>{{ 'Save changes' if editing else 'Save password' }}</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('vault') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>

    <div class="card" id="generator" data-min="{{ limits.min }}" data-max="{{ limits.max }}">
      <div class="card-header bg-transparent fw-semibold"><i class="bi bi-magic me-1"></i>Password generator</div>
      <div class="card-body">
        <div class="mb-3">
          <label class="form-label" for="gen-length">Length: <strong id="gen-length-value">20</strong></label>
          <input class="form-range" type="range" id="gen-length" min="{{ limits.min }}" max="{{ limits.max }}" value="20">
        </div>
        <div class="d-flex flex-wrap gap-3 mb-3">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-upper" checked><label class="form-check-label" for="gen-upper">Uppercase (A-Z)</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-lower" checked><label class="form-check-label" for="gen-lower">Lowercase (a-z)</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-digits" checked><label class="form-check-label" for="gen-digits">Numbers (0-9)</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-symbols" checked><label class="form-check-label" for="gen-symbols">Symbols (!@#$&hellip;)</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="gen-ambiguous"><label class="form-check-label" for="gen-ambiguous">Avoid look-alikes (I, l, 1, O, 0)</label></div>
        </div>
        <button class="btn btn-outline-primary" type="button" id="gen-button"><i class="bi bi-arrow-repeat me-1"></i>Generate &amp; fill</button>
        <span id="gen-error" class="text-danger small ms-2" role="alert"></span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
