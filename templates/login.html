{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Welcome back</h1>
        <p class="text-body-secondary">Sign in with your username and master password.</p>
        <form method="post" action="{{ url_for('login') }}" autocomplete="on">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" value="{{ username }}" maxlength="64" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Master password</label>
            <div class="input-group">
              <input class="form-control" id="password" name="password" type="password" maxlength="1024" required autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show or hide password"><i class="bi bi-eye"></i></button>
            </div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
        <p class="mt-3 mb-0 text-center small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
